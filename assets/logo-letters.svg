        <pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
            <line id="hline" x1="0" y1="0" x2="0" y2="5" stroke="black" stroke-width="1"/>
        </pattern>

        <!-- white keeps, black cuts: the lines become grooves through the letter -->
        <mask id="knock" maskUnits="userSpaceOnUse" x="-200" y="-200" width="1300" height="630">
            <rect x="-200" y="-200" width="1300" height="630" fill="white"/>
            <rect id="knockLines" x="-200" y="-200" width="1300" height="630" fill="url(#hatch)"/>
        </mask>

        <clipPath id="glyphClip">
            <use href="#word"/>
        </clipPath>

        <filter id="soften" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur id="fblur" stdDeviation="1.5"/>
        </filter>
    </defs>

    <!-- 1. shadow, grooved to match so the cut reads all the way through -->
    <g id="shadowG" filter="url(#soften)" opacity="0.42" mask="url(#knock)">
        <use href="#word" x="5" y="5" fill="#4A0B08"/>
    </g>

    <!-- 2. letterform with the hatch cut out of it -->
    <use href="#word" mask="url(#knock)" fill="#f4efe4"/>

    <!-- 3. inward rim, painted three times so no groove survives at the clip edge -->
    <g id="rimG" clip-path="url(#glyphClip)" fill="none" stroke="#f4efe4" stroke-width="20" stroke-linejoin="round">
        <use href="#word"/>
        <use href="#word"/>
        <use href="#word"/>
    </g>
</svg>
